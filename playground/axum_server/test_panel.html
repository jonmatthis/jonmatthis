<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axum Server Test Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, monospace;
    background: #0f172a; color: #e2e8f0;
    max-width: 760px; margin: 40px auto; padding: 0 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; color: #f97316; }
  .subtitle { font-size: 0.78rem; color: #64748b; margin-bottom: 24px; }
  section {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 8px; padding: 20px; margin-bottom: 18px;
  }
  section h2 {
    font-size: 0.9rem; margin-bottom: 10px; color: #60a5fa;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button {
    background: #2563eb; color: #fff; border: none;
    border-radius: 4px; padding: 8px 16px; font-size: 0.8rem;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  button:hover { background: #3b82f6; }
  button:active { background: #1d4ed8; }
  button.green { background: #16a34a; }
  button.green:hover { background: #22c55e; }
  button.red { background: #dc2626; }
  button.red:hover { background: #ef4444; }
  button.gray { background: #475569; }
  button.gray:hover { background: #64748b; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  input, textarea {
    background: #0f172a; border: 1px solid #475569; color: #e2e8f0;
    border-radius: 4px; padding: 8px 12px; font-size: 0.8rem;
    font-family: inherit; flex: 1; min-width: 140px;
  }
  textarea { min-height: 40px; resize: vertical; }
  .output {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 4px; padding: 12px; font-size: 0.76rem;
    min-height: 40px; max-height: 260px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all; line-height: 1.5;
  }
  .ts { color: #64748b; }
  .ok { color: #22c55e; }
  .err { color: #ef4444; }
  .info { color: #60a5fa; }
  .warn { color: #f59e0b; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .dot.on { background: #22c55e; }
  .dot.off { background: #ef4444; }
</style>
</head>
<body>

<h1>Axum Server Test Panel</h1>
<p class="subtitle">
  REST: <a href="http://127.0.0.1:7878/" style="color:#60a5fa">http://127.0.0.1:7878/</a>
  &nbsp;|&nbsp;
  <a href="http://127.0.0.1:7878/docs" style="color:#f97316" target="_blank">Swagger UI →</a>
</p>

<!-- ═══ REST ═══ -->
<section>
  <h2>REST Endpoints</h2>
  <div class="btn-row">
    <button onclick="getJson('/')">GET /</button>
    <button onclick="getJson('/health')">GET /health</button>
  </div>
  <div class="btn-row">
    <textarea id="echo-body" placeholder='{"content": "hello axum"}'>{"content": "hello axum"}</textarea>
    <button class="green" onclick="postEcho()">POST /echo</button>
  </div>
  <div id="rest-out" class="output">Click a button...</div>
</section>

<!-- ═══ WebSocket ═══ -->
<section>
  <h2>WebSocket <span id="ws-st"><span class="dot off"></span>disconnected</span></h2>
  <div class="btn-row">
    <button class="green" id="btn-c" onclick="wsConnect()">Connect</button>
    <button class="red" id="btn-d" onclick="wsClose()" disabled>Disconnect</button>
  </div>
  <div class="btn-row">
    <input id="ws-input" type="text" placeholder="Message..." value="Hello!" />
    <button id="btn-s" onclick="wsSend()" disabled>Send</button>
  </div>
  <div id="ws-out" class="output">Not connected.</div>
</section>

<script>
const BASE = 'http://127.0.0.1:7878';
const WS_URL = 'ws://127.0.0.1:7878/ws';

function ts() { return new Date().toLocaleTimeString(); }
function esc(s) { const e = document.createElement('span'); e.textContent = s; return e.innerHTML; }

// ── REST ──────────────────────────────────────
async function getJson(path) {
  const o = document.getElementById('rest-out');
  o.innerHTML = `<span class="ts">[${ts()}]</span> <span class="info">GET ${path}</span>\n`;
  try {
    const r = await fetch(BASE + path);
    const body = await r.json();
    o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="ok">${r.status}</span> → ${esc(JSON.stringify(body, null, 2))}\n`;
  } catch (e) {
    o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="err">ERROR: ${esc(e.message)}</span>\n`;
  }
  o.scrollTop = o.scrollHeight;
}

async function postEcho() {
  const o = document.getElementById('rest-out');
  const body = document.getElementById('echo-body').value;
  o.innerHTML = `<span class="ts">[${ts()}]</span> <span class="info">POST /echo</span>\n`;
  try {
    const r = await fetch(BASE + '/echo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    const j = await r.json();
    o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="${r.ok ? 'ok' : 'err'}">${r.status}</span> → ${esc(JSON.stringify(j, null, 2))}\n`;
  } catch (e) {
    o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="err">ERROR: ${esc(e.message)}</span>\n`;
  }
  o.scrollTop = o.scrollHeight;
}

// ── WebSocket ──────────────────────────────────
let ws = null;

function setWs(on) {
  document.getElementById('btn-c').disabled = on;
  document.getElementById('btn-d').disabled = !on;
  document.getElementById('btn-s').disabled = !on;
  document.getElementById('ws-st').innerHTML = on
    ? '<span class="dot on"></span>connected'
    : '<span class="dot off"></span>disconnected';
}

function wsConnect() {
  const o = document.getElementById('ws-out');
  o.innerHTML = `<span class="ts">[${ts()}]</span> <span class="info">Connecting to ${WS_URL}...</span>\n`;

  ws = new WebSocket(WS_URL);
  ws.onopen = () => { setWs(true); o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="ok">Connected (101)</span>\n`; o.scrollTop = o.scrollHeight; };
  ws.onmessage = (e) => { o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="info">←</span> ${esc(e.data)}\n`; o.scrollTop = o.scrollHeight; };
  ws.onclose = (e) => { setWs(false); o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="warn">Closed (${e.code})</span>\n`; o.scrollTop = o.scrollHeight; };
  ws.onerror = () => { o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="err">Error</span>\n`; o.scrollTop = o.scrollHeight; };
}

function wsSend() {
  if (!ws || ws.readyState !== 1) return;
  const msg = document.getElementById('ws-input').value || 'ping';
  const o = document.getElementById('ws-out');
  o.innerHTML += `<span class="ts">[${ts()}]</span> <span class="info">→</span> ${esc(msg)}\n`;
  ws.send(msg);
  o.scrollTop = o.scrollHeight;
}

function wsClose() { if (ws) ws.close(1000, 'User closed'); }

document.getElementById('ws-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') wsSend(); });
</script>
</body>
</html>
