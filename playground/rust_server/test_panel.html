<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust Server Test Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, monospace;
    background: #1a1a2e;
    color: #e0e0e0;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 8px; color: #f97316; }
  .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 28px; }
  section {
    background: #16213e;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: #60a5fa;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: #3b82f6; }
  button:active { background: #1d4ed8; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #ef4444; }
  button.success { background: #16a34a; }
  button.success:hover { background: #22c55e; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input {
    background: #0f0f23;
    border: 1px solid #3a3a5a;
    color: #e0e0e0;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 0.82rem;
    font-family: inherit;
    flex: 1;
    min-width: 160px;
  }
  .output {
    background: #0f0f23;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    padding: 12px;
    font-size: 0.78rem;
    min-height: 40px;
    max-height: 280px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .output .ts { color: #666; }
  .output .ok { color: #22c55e; }
  .output .err { color: #ef4444; }
  .output .info { color: #60a5fa; }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: #22c55e; }
  .status-dot.disconnected { background: #ef4444; }
</style>
</head>
<body>

<h1>Rust Server Test Panel</h1>
<p class="subtitle">Target: 127.0.0.1:7878 &nbsp;| &nbsp;Open this file directly in a browser (file://)</p>

<!-- ═══════════════════ HTTP ═══════════════════ -->
<section>
  <h2>HTTP Endpoints</h2>
  <div class="btn-row">
    <button onclick="getPath('/')">GET /</button>
    <button onclick="getPath('/health')">GET /health</button>
    <button onclick="getPath('/nonexistent')">GET /nonexistent (404)</button>
  </div>
  <div id="http-output" class="output">Click a button to send an HTTP request...</div>
</section>

<!-- ═══════════════════ WebSocket ═══════════════════ -->
<section>
  <h2>WebSocket <span id="ws-status"><span class="status-dot disconnected"></span>disconnected</span></h2>
  <div class="btn-row">
    <button class="success" id="btn-connect" onclick="wsConnect()">Connect</button>
    <button class="danger" id="btn-disconnect" onclick="wsDisconnect()" disabled>Disconnect</button>
  </div>
  <div class="btn-row">
    <input id="ws-msg" type="text" placeholder="Type a message..." value="Hello from browser!" />
    <button id="btn-send" onclick="wsSend()" disabled>Send</button>
  </div>
  <div id="ws-output" class="output">Not connected. Click "Connect" to open a WebSocket.</div>
</section>

<script>
const SERVER = 'http://127.0.0.1:7878';
const WS_URL = 'ws://127.0.0.1:7878/';

// ── HTTP ──────────────────────────────────────
async function getPath(path) {
  const out = document.getElementById('http-output');
  const ts = new Date().toLocaleTimeString();
  out.innerHTML = `<span class="ts">[${ts}]</span> <span class="info">GET ${path}</span> ...\n`;
  try {
    const res = await fetch(SERVER + path);
    const body = await res.text();
    const status = res.ok ? 'ok' : 'err';
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="${status}">${res.status} ${res.statusText}</span>\n`;
    out.innerHTML += `<span class="ts">[${ts}]</span> Body: ${escapeHtml(body)}\n`;
  } catch (e) {
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="err">ERROR: ${e.message}</span>\n`;
  }
  out.scrollTop = out.scrollHeight;
}

// ── WebSocket ─────────────────────────────────
let ws = null;

function setWsState(connected) {
  document.getElementById('btn-connect').disabled = connected;
  document.getElementById('btn-disconnect').disabled = !connected;
  document.getElementById('btn-send').disabled = !connected;
  const dot = connected ? 'connected' : 'disconnected';
  const label = connected ? 'connected' : 'disconnected';
  document.getElementById('ws-status').innerHTML =
    `<span class="status-dot ${dot}"></span>${label}`;
}

function wsConnect() {
  const out = document.getElementById('ws-output');
  const ts = new Date().toLocaleTimeString();
  out.innerHTML = `<span class="ts">[${ts}]</span> <span class="info">Connecting to ${WS_URL}...</span>\n`;

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    const ts = new Date().toLocaleTimeString();
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="ok">Connected (101 Switching Protocols)</span>\n`;
    setWsState(true);
    out.scrollTop = out.scrollHeight;
  };

  ws.onmessage = (e) => {
    const ts = new Date().toLocaleTimeString();
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="info">← Received:</span> ${escapeHtml(e.data)}\n`;
    out.scrollTop = out.scrollHeight;
  };

  ws.onclose = (e) => {
    const ts = new Date().toLocaleTimeString();
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="err">Closed (code: ${e.code})</span>\n`;
    setWsState(false);
    out.scrollTop = out.scrollHeight;
  };

  ws.onerror = () => {
    const ts = new Date().toLocaleTimeString();
    out.innerHTML += `<span class="ts">[${ts}]</span> <span class="err">WebSocket error</span>\n`;
    out.scrollTop = out.scrollHeight;
  };
}

function wsSend() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const input = document.getElementById('ws-msg');
  const msg = input.value || 'ping';
  const ts = new Date().toLocaleTimeString();
  const out = document.getElementById('ws-output');
  out.innerHTML += `<span class="ts">[${ts}]</span> <span class="info">→ Sent:</span> ${escapeHtml(msg)}\n`;
  ws.send(msg);
  out.scrollTop = out.scrollHeight;
}

function wsDisconnect() {
  if (ws) ws.close(1000, 'User closed');
}

// ── Helpers ───────────────────────────────────
function escapeHtml(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

// Enter key in the WS input triggers send
document.getElementById('ws-msg').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') wsSend();
});
</script>

</body>
</html>
